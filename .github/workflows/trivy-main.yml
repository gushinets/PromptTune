name: Publish Trivy on main

on:
  workflow_run:
    workflows: [Trivy]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  publish:
    name: Publish Trivy (${{ matrix.target }})
    # A Dependabot squash push can scan, but its token cannot publish SARIF.
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [extension, backend]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Download report from the scan run
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          name: trivy-${{ matrix.target }}
          path: ${{ runner.temp }}/trivy

      - name: Upload report to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: ${{ runner.temp }}/trivy/trivy.sarif
          ref: refs/heads/main
          sha: ${{ github.event.workflow_run.head_sha }}
          category: trivy-${{ matrix.target }}
