name: required-ci

on:
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend_changed: ${{ steps.changed-files.outputs.backend_changed }}
      extension_changed: ${{ steps.changed-files.outputs.extension_changed }}
    steps:
      - uses: actions/github-script@v7
        id: changed-files
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });

            const paths = files.map((file) => file.filename);
            const backendChanged = paths.some((path) =>
              path.startsWith("backend/") || path.startsWith(".github/workflows/")
            );
            const extensionChanged = paths.some((path) =>
              path.startsWith("extension/") ||
              path === ".gitattributes" ||
              path === ".editorconfig" ||
              path.startsWith(".github/workflows/")
            );

            core.setOutput("backend_changed", String(backendChanged));
            core.setOutput("extension_changed", String(extensionChanged));

  backend-lint:
    name: backend lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend_changed == 'true'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  backend-tests:
    name: backend tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend_changed == 'true'
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: prompttune
          POSTGRES_PASSWORD: prompttune
          POSTGRES_DB: prompttune_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prompttune"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://prompttune:prompttune@localhost:5432/prompttune_test
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - run: pip install -e ".[dev]"
      - run: alembic upgrade head
      - run: pytest -q

  extension-lint-build-test:
    name: extension lint/build/test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.extension_changed == 'true'
    defaults:
      run:
        working-directory: extension

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage

      - uses: actions/upload-artifact@v4
        with:
          name: extension-coverage
          path: extension/coverage/

      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: extension-chrome
          path: extension/.output/chrome-mv3/

  required:
    name: required-ci / required
    runs-on: ubuntu-latest
    needs:
      - changes
      - backend-lint
      - backend-tests
      - extension-lint-build-test
    if: always()
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const results = {
              changes: "${{ needs.changes.result }}",
              backendLint: "${{ needs['backend-lint'].result }}",
              backendTests: "${{ needs['backend-tests'].result }}",
              extension: "${{ needs['extension-lint-build-test'].result }}",
            };

            const failed = Object.entries(results).filter(([, result]) =>
              result === "failure" || result === "cancelled"
            );

            if (failed.length > 0) {
              core.setFailed(`Required CI failed: ${failed.map(([name, result]) => `${name}=${result}`).join(", ")}`);
            }
