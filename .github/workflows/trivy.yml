name: Trivy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: read

jobs:
  scan:
    name: Trivy (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [extension, backend]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.2

      - name: Scan extension dependencies
        if: matrix.target == 'extension'
        # Scan from the repository root so SARIF paths include extension/.
        run: trivy fs --scanners vuln --include-dev-deps --format sarif --exit-code 0 --output trivy.sarif .

      - name: Build backend image
        if: matrix.target == 'backend'
        run: docker build --platform linux/amd64 --iidfile backend-image-id.txt --tag prompttune-backend:trivy backend

      - name: Scan backend image
        if: matrix.target == 'backend'
        run: trivy image --image-src docker --scanners vuln --format sarif --exit-code 0 --output trivy.sarif "$(cat backend-image-id.txt)"

      - name: Save main report for publication
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-${{ matrix.target }}
          path: trivy.sarif
          if-no-files-found: error
          overwrite: true

      - name: Upload report to GitHub Code Scanning
        if: github.event_name == 'pull_request'
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.target }}

      - name: Record installed backend packages and image identity
        if: matrix.target == 'backend'
        run: |
          image="$(cat backend-image-id.txt)"
          docker image inspect "$image" > backend-image.json
          docker run --rm --network none --entrypoint python "$image" -m pip list --format=json > backend-packages.json
          docker run --rm --network none --entrypoint dpkg-query "$image" -W > backend-os-packages.txt
          docker run --rm --network none --entrypoint python "$image" -m pip check
          trivy image --image-src docker --scanners vuln --pkg-types os,library --list-all-pkgs --format json --exit-code 0 --output backend-vulnerabilities.json "$image"

      - name: Verify the exact backend image starts and is healthy
        if: matrix.target == 'backend'
        run: |
          image="$(cat backend-image-id.txt)"
          docker network create backend-smoke
          docker run -d --name backend-smoke-db --network backend-smoke \
            -e POSTGRES_USER=prompttune -e POSTGRES_PASSWORD=smoke-only \
            -e POSTGRES_DB=prompttune postgres:16-alpine
          docker run -d --name backend-smoke-redis --network backend-smoke redis:7-alpine
          for attempt in $(seq 1 30); do
            if docker exec backend-smoke-db pg_isready -h 127.0.0.1 -U prompttune -d prompttune; then break; fi
            sleep 1
          done
          docker exec backend-smoke-db pg_isready -h 127.0.0.1 -U prompttune -d prompttune
          docker run --rm --network backend-smoke \
            -e DATABASE_URL=postgresql+asyncpg://prompttune:smoke-only@backend-smoke-db/prompttune \
            -e REDIS_URL=redis://backend-smoke-redis:6379/0 "$image" alembic upgrade head
          docker run -d --name backend-smoke-api --network backend-smoke \
            -e DATABASE_URL=postgresql+asyncpg://prompttune:smoke-only@backend-smoke-db/prompttune \
            -e REDIS_URL=redis://backend-smoke-redis:6379/0 "$image"
          running="$(docker inspect --format '{{.Image}}' backend-smoke-api)"
          test "$running" = "$image"
          docker exec -i backend-smoke-api python - "$running" > backend-health.json <<'PY'
          import json
          import sys
          import time
          import urllib.request

          for attempt in range(30):
              try:
                  checks = {}
                  for path in ("/healthz", "/readyz"):
                      with urllib.request.urlopen("http://localhost:8000" + path, timeout=2) as response:
                          body = json.load(response)
                          assert response.status == 200 and body == {"status": "ok"}
                          checks[path] = {"status": response.status, "body": body}
                  print(json.dumps({"image_id": sys.argv[1], "checks": checks}, indent=2))
                  break
              except OSError:
                  if attempt == 29:
                      raise
                  time.sleep(1)
          PY

      - name: Save backend dependency evidence
        if: matrix.target == 'backend'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-dependencies-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            backend-image-id.txt
            backend-image.json
            backend-packages.json
            backend-os-packages.txt
            backend-vulnerabilities.json
            backend-health.json
          if-no-files-found: error

      - name: Export audited backend image
        if: matrix.target == 'backend'
        run: |
          docker image save --output backend-image.tar "$(cat backend-image-id.txt)"
          sha256sum backend-image.tar > backend-image.tar.sha256

      - name: Save audited backend image for deployment without rebuilding
        if: matrix.target == 'backend'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-release-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            backend-image.tar
            backend-image.tar.sha256
            backend-image-id.txt
          if-no-files-found: error
          retention-days: 7
