name: Trivy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: read

jobs:
  scan:
    name: Trivy (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [extension, backend]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.2

      - name: Scan extension dependencies
        if: matrix.target == 'extension'
        # Scan from the repository root so SARIF paths include extension/.
        run: trivy fs --scanners vuln --include-dev-deps --format sarif --exit-code 0 --output trivy.sarif .

      - name: Build backend image
        if: matrix.target == 'backend'
        run: docker build --tag prompttune-backend:trivy backend

      - name: Scan backend image
        if: matrix.target == 'backend'
        run: trivy image --image-src docker --scanners vuln --format sarif --exit-code 0 --output trivy.sarif prompttune-backend:trivy

      - name: Save main report for publication
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-${{ matrix.target }}
          path: trivy.sarif
          if-no-files-found: error
          overwrite: true

      - name: Upload report to GitHub Code Scanning
        if: github.event_name == 'pull_request'
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.target }}

      - name: Record installed backend packages and image identity
        if: matrix.target == 'backend'
        run: |
          docker image inspect prompttune-backend:trivy > backend-image.json
          docker run --rm --network none --entrypoint python prompttune-backend:trivy -m pip list --format=json > backend-packages.json
          docker run --rm --network none --entrypoint python prompttune-backend:trivy -m pip check
          trivy image --image-src docker --scanners vuln --format json --exit-code 0 --output backend-vulnerabilities.json prompttune-backend:trivy

      - name: Save backend dependency evidence
        if: matrix.target == 'backend'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-dependencies-${{ github.sha }}
          path: |
            backend-image.json
            backend-packages.json
            backend-vulnerabilities.json
          if-no-files-found: error
